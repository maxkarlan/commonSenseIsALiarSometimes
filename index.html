<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Common Sense</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none; /* prevent browser gestures while dragging */
        }

        .title {
            position: fixed;
            left: 0;
            right: 0;
            padding: 0 16px;
            text-align: center;
            color: #fff;
            mix-blend-mode: difference; /* reads against both the white shape and black background */
            font-size: clamp(18px, 4vw, 40px);
            line-height: 1.4;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
        }

        .title-top { top: 6vh; animation-delay: 1s; }
        .title-bottom { bottom: 6vh; animation-delay: 3.5s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="title title-top">Common Sense Is A Liar</div>
    <div class="title title-bottom">Sometimes</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let morphingObject, mainLight, sideLight, endCircle;
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let rotationX = 0, rotationY = 0;
        let spinX = 0, spinY = 0; // rotation velocity from taps, decays each frame
        let downX = 0, downY = 0, dragDistance = 0;
        let R = 160; // dynamic radius, set in init/resize
        let baseDistance = 0; // camera distance before zoom
        const ZOOM_MIN = 0.8, ZOOM_MAX = 1.4; // limits on zoom in / out
        let zoom = 1, targetZoom = 1;
        let pinchStartDist = 0, pinchStartZoom = 1, isPinching = false;

        function computeRadius() {
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            return Math.max(20, Math.floor(minDim * 0.45));
        }

        function positionCameraToFit(fillRatio = 0.75) {
            // Ensure same buffer on all sides: fit both height and width
            const vFov = (camera.fov * Math.PI) / 180;
            const t = Math.tan(vFov / 2);
            const aspect = window.innerWidth / window.innerHeight;
            const r = clamp(fillRatio, 0.01, 0.99);
            // Required distance to fit vertically and horizontally (object diameter = 2R)
            const dV = R / (r * t);
            const dH = R / (r * t * aspect);
            baseDistance = Math.max(dV, dH);
            camera.position.set(0, 0, baseDistance * zoom);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            R = computeRadius();
            positionCameraToFit(0.75);

            createMorphingObject();
            createEndCircle();
            setupLighting();
            setupEventListeners();
            animate();
        }

        function createMorphingObject() {
            if (morphingObject) {
                morphingObject.geometry.dispose();
                morphingObject.material.dispose();
                scene.remove(morphingObject);
                morphingObject = undefined;
            }

            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const indices = [];

            const layers = 40;
            const segments = 64;
            // Grow the near (rectangular) end so it always covers the full view at start
            const nearDist = baseDistance - 1.25 * R;
            const viewHalfY = Math.tan((camera.fov * Math.PI) / 360) * nearDist * 1.02;
            const viewHalfX = viewHalfY * camera.aspect;
            const rectHalfX = Math.max(R * 0.75, viewHalfX);
            const rectHalfY = Math.max(R * 0.5, viewHalfY);

            for (let z = 0; z < layers; z++) {
                const morphFactor = z / (layers - 1);
                const smoothFactor = morphFactor * morphFactor * (3 - 2 * morphFactor);
                const zPos = -1.25 * R + (2.5 * R) * (z / (layers - 1));

                for (let i = 0; i < segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;

                    let x = Math.cos(angle) * R;
                    let y = Math.sin(angle) * R;

                    if (smoothFactor > 0) {
                        const rectX = x > 0 ? rectHalfX : -rectHalfX;
                        const rectY = y > 0 ? rectHalfY : -rectHalfY;
                        x = x + (rectX - x) * smoothFactor;
                        y = y + (rectY - y) * smoothFactor;
                    }

                    let sphereZ = 0;
                    if (smoothFactor < 0.1) {
                        const d = Math.hypot(x, y);
                        if (d <= R) sphereZ = Math.sqrt(R * R - d * d);
                    } else if (smoothFactor < 0.6) {
                        const d = Math.hypot(x, y);
                        if (d <= R) sphereZ = Math.sqrt(Math.max(0, R * R - d * d)) * (1 - (smoothFactor - 0.1) / 0.5);
                    }
                    const finalZ = zPos + sphereZ;

                    vertices.push(x, y, finalZ);
                }
            }

            for (let z = 0; z < layers - 1; z++) {
                for (let i = 0; i < segments; i++) {
                    const current = z * segments + i;
                    const next = z * segments + ((i + 1) % segments);
                    const below = (z + 1) * segments + i;
                    const belowNext = (z + 1) * segments + ((i + 1) % segments);
                    indices.push(current, below, next);
                    indices.push(next, below, belowNext);
                }
            }

            geometry.setIndex(indices);
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.computeVertexNormals();

            const material = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                side: THREE.DoubleSide
            });

            morphingObject = new THREE.Mesh(geometry, material);
            morphingObject.castShadow = true;
            morphingObject.receiveShadow = true;
            scene.add(morphingObject);
        }

        function createEndCircle() {
            if (endCircle) {
                endCircle.geometry.dispose();
                endCircle.material.dispose();
                scene.remove(endCircle);
                endCircle = undefined;
            }

            // Create a circle at the far end of the tunnel
            const circleGeometry = new THREE.CircleGeometry(R * 0.95, 64);
            const circleMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0
            });

            endCircle = new THREE.Mesh(circleGeometry, circleMaterial);
            // Position at the circular end of the tunnel (zPos at first layer)
            endCircle.position.z = -1.25 * R;
            scene.add(endCircle);
        }

        function setupLighting() {
            if (mainLight) scene.remove(mainLight);
            if (sideLight) scene.remove(sideLight);

            mainLight = new THREE.PointLight(0xffffff, 0.6, R * 20);
            mainLight.position.set(-0.56 * R, -0.31 * R, 1.9 * R);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 1024;
            mainLight.shadow.mapSize.height = 1024;
            scene.add(mainLight);

            sideLight = new THREE.PointLight(0xffffff, 0.9, R * 20);
            sideLight.position.set(1.25 * R, 0, 0.1 * R);
            scene.add(sideLight);

            const ambientLight = new THREE.AmbientLight(0x404040, 0.25);
            scene.add(ambientLight);
        }

        function setupEventListeners() {
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            renderer.domElement.addEventListener('wheel', onWheel, { passive: false });
            // Touch support
            renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });
            renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: false });
            renderer.domElement.addEventListener('touchend', onTouchEnd, { passive: false });
            window.addEventListener('resize', onWindowResize);
        }

        const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

        function startPress(x, y) {
            isMouseDown = true;
            mouseX = downX = x;
            mouseY = downY = y;
            dragDistance = 0;
        }

        function dragTo(x, y) {
            const deltaX = x - mouseX;
            const deltaY = y - mouseY;
            rotationY += deltaX * 0.01;
            rotationX += deltaY * 0.01;
            dragDistance += Math.hypot(deltaX, deltaY);
            mouseX = x;
            mouseY = y;
        }

        // A tap (press without dragging) gives the shape a small push toward the tap
        function nudge(x, y) {
            let dx = x - window.innerWidth / 2;
            let dy = y - window.innerHeight / 2;
            let len = Math.hypot(dx, dy);
            if (len < 1) {
                const a = Math.random() * Math.PI * 2;
                dx = Math.cos(a); dy = Math.sin(a); len = 1;
            }
            const strength = 0.03;
            spinY += (dx / len) * strength;
            spinX += (dy / len) * strength;
        }

        function onMouseDown(event) {
            startPress(event.clientX, event.clientY);
        }

        function onMouseMove(event) {
            if (!isMouseDown) return;
            dragTo(event.clientX, event.clientY);
        }

        function onMouseUp(event) {
            if (isMouseDown && dragDistance < 6) nudge(event.clientX, event.clientY);
            isMouseDown = false;
        }

        function onWheel(e) {
            e.preventDefault();
            targetZoom = clamp(targetZoom * Math.exp(e.deltaY * 0.001), ZOOM_MIN, ZOOM_MAX);
        }

        // Touch handlers
        function touchDistance(touches) {
            return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
        }

        function onTouchStart(e) {
            if (!e.touches || e.touches.length === 0) return;
            e.preventDefault();
            if (e.touches.length >= 2) {
                isPinching = true;
                isMouseDown = false;
                pinchStartDist = touchDistance(e.touches);
                pinchStartZoom = targetZoom;
                return;
            }
            const t = e.touches[0];
            startPress(t.clientX, t.clientY);
        }

        function onTouchMove(e) {
            if (!e.touches || e.touches.length === 0) return;
            e.preventDefault();
            if (isPinching && e.touches.length >= 2) {
                const d = touchDistance(e.touches);
                if (d > 0) targetZoom = clamp(pinchStartZoom * (pinchStartDist / d), ZOOM_MIN, ZOOM_MAX);
                return;
            }
            if (!isMouseDown) return;
            const t = e.touches[0];
            dragTo(t.clientX, t.clientY);
        }

        function onTouchEnd(e) {
            e.preventDefault();
            if (isPinching) {
                // Lifting one finger after a pinch continues as a drag, never a tap
                if (e.touches.length === 1) {
                    startPress(e.touches[0].clientX, e.touches[0].clientY);
                    dragDistance = Infinity;
                }
                if (e.touches.length === 0) {
                    isPinching = false;
                    isMouseDown = false;
                }
                return;
            }
            if (isMouseDown && dragDistance < 8 && e.changedTouches.length) {
                const t = e.changedTouches[0];
                nudge(t.clientX, t.clientY);
            }
            isMouseDown = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            R = computeRadius();
            positionCameraToFit(0.75);
            createMorphingObject();
            createEndCircle();
            setupLighting();
        }

        function animate() {
            requestAnimationFrame(animate);
            rotationX += spinX;
            rotationY += spinY;
            spinX *= 0.9;
            spinY *= 0.9;
            zoom += (targetZoom - zoom) * 0.15;
            camera.position.z = baseDistance * zoom;
            if (morphingObject) {
                morphingObject.rotation.x = rotationX;
                morphingObject.rotation.y = rotationY;
            }
            if (endCircle) {
                endCircle.rotation.x = rotationX;
                endCircle.rotation.y = rotationY;
            }
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
